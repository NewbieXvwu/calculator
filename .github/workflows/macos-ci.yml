# macOS 移植的 CI。原微软 Windows/UWP 流水线（action-ci.yml）已删除——对本移植无意义。
#
# 约束：
#   - 需 macOS 26 SDK / Xcode 26：编译 Liquid Glass 的 #available(macOS 26) 分支，
#     并让 xcodebuild 经 xcstringstool 编译 .xcstrings（纯 swift build 不跑它）。
#   - libgiac.a（31MB）不入库，由 Tools/build_giac.sh 现场构建并经 actions/cache 缓存。
#   - 引擎测试（C++）不依赖 giac，单列一个快 job 并行跑。
#   - Release 产物静态链 giac → 整体 GPLv3；Tools/package_app.sh 组装 MacCalculator.app
#     （Info.plist + ad-hoc 签名）并产出 DMG——DMG 保留执行权限，upload-artifact 的 zip 不会。

name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: C++ 引擎测试（不依赖 giac）
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 工具链版本
        run: swift --version && xcodebuild -version
      - name: 引擎 C++17 可移植性检查（防隐式 include / C++20 依赖）
        run: Tools/check_engine_cxx17.sh
      - name: 引擎单元测试（原版 CalcManager 70 例）
        run: swift run engine-tests
      - name: 冒烟测试
        run: swift run calc-smoke

  # S10 跨架构逐位一致性：同一份 tests/golden/scalar_vectors.txt 在 x86-64 Linux
  # 上必须与 arm64 macOS（上面的 engine job）逐位一致。不用 SPM——纯 clang++ 编译，
  # 排除任何 Xcode/Apple 工具链因素。
  engine-x64:
    name: 引擎黄金测试（x86-64 Linux，跨架构逐位一致）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 工具链版本
        run: clang++ --version
      - name: 可移植构建 + 黄金向量测试
        run: Tools/build_engine_tests_portable.sh

  app:
    name: App 构建 / 测试 / Release 产物
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: 工具链版本
        run: swift --version && xcodebuild -version

      # giac 链接期需要 gmp/mpfr/gettext 的 dylib（即使命中缓存也要装）。
      - name: 安装 giac 链接依赖
        run: brew install gmp mpfr gettext

      - name: 缓存 libgiac.a
        id: giac-cache
        uses: actions/cache@v6
        with:
          path: third_party/giac
          # giac 版本的唯一事实来源是脚本默认值；升版本改脚本 → 哈希变 → 缓存自动失效。
          key: giac-${{ runner.arch }}-${{ hashFiles('Tools/build_giac.sh') }}

      - name: 构建 giac（缓存未命中时）
        if: steps.giac-cache.outputs.cache-hit != 'true'
        run: Tools/build_giac.sh

      # swift test 与 xcodebuild test 跑的是同一个 XCTest bundle（唯一测试 target），
      # xcodebuild 是严格超集：额外经 xcstringstool 编译 .xcstrings，本地化 catalog
      # 用例才真正断言而非跳过。故只保留一次测试构建，不再单独 swift build/swift test。
      - name: 测试（xcodebuild：全部逻辑用例 + .xcstrings + 真玻璃分支）
        run: |
          xcodebuild test \
            -scheme MacCalculator-Package \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .dd

      - name: Release 配置构建（含 C/C++ 全量 LTO）
        run: |
          xcodebuild build \
            -configuration Release \
            -scheme MacCalculator \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .dd \
            LLVM_LTO=YES

      - name: 打包 MacCalculator.app + DMG（GPLv3）
        run: Tools/package_app.sh .dd/Build/Products/Release MacCalculator.dmg

      - name: 上传 Release 产物（直传 DMG，免外层 zip）
        uses: actions/upload-artifact@v7
        with:
          path: MacCalculator.dmg
          archive: false
          if-no-files-found: error
